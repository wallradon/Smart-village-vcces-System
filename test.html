<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Dashboard</title>
    <style>
        /* ตัวอย่าง CSS เบื้องต้นสำหรับจัดหน้าให้สวยงาม */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            text-align: center;
            padding: 20px;
        }

        .dashboard-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            display: inline-block;
        }

        #tempGraph {
            max-width: 100%;
            height: auto;
            border-radius: 5px;
            border: 1px solid #ddd;
        }

        .loading-text {
            color: #666;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <div class="dashboard-container">
        <h2>อุณหภูมิห้องล่าสุด</h2>

        <!-- รูปภาพกราฟจะมาแสดงตรงนี้ -->
        <img id="tempGraph" src="" alt="Temperature Graph Loading...">

        <p class="loading-text" id="statusText">กำลังโหลดข้อมูลเริ่มต้น...</p>
    </div>

    <script>
        // --- 1. ลิงก์ Grafana ที่แปลงสำหรับ Render Image แล้ว ---
        // เปลี่ยน /d/ เป็น /render/d-solo/ และเปลี่ยน viewPanel เป็น panelId
        const grafanaBaseUrl = "https://redcanyon1221.grafana.net/render/d-solo/wag7kpn/f09f8ca1-efb88f-temperature-room-dashboard?orgId=1&panelId=panel-6&width=1000&height=500&timezone=browser";

        const imgElement = document.getElementById("tempGraph");
        const statusText = document.getElementById("statusText");

        // --- 2. ฟังก์ชันอัปเดตรูปภาพ ---
        function updateGraph() {
            statusText.innerText = "กำลังรีเฟรชข้อมูล...";

            // ใช้ Timestamp ป้องกัน Browser แคชรูปภาพเดิม
            const timeNow = new Date().getTime();
            imgElement.src = `${grafanaBaseUrl}&t=${timeNow}`;
        }

        // เมื่อรูปภาพโหลดเสร็จ ให้เปลี่ยนข้อความสถานะ
        imgElement.onload = function () {
            const now = new Date();
            statusText.innerText = `อัปเดตล่าสุด: ${now.toLocaleTimeString('th-TH')}`;
        };

        // เมื่อรูปภาพโหลดไม่สำเร็จ (เผื่ออินเทอร์เน็ตหลุด)
        imgElement.onerror = function () {
            statusText.innerText = "เกิดข้อผิดพลาดในการโหลดกราฟ";
            statusText.style.color = "red";
        };

        // --- 3. เริ่มการทำงาน ---
        // โหลดทันทีที่เปิดหน้าเว็บ
        updateGraph();

        // ตั้งเวลาให้โหลดภาพใหม่ทุกๆ 10 วินาที (10000 ms)
        setInterval(updateGraph, 10000);

    </script>

</body>

</html>
