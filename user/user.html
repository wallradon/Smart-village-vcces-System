<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart-Village-Access-System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Header หลัก -->
    <header>
        <div class="logo-box">
            <img src="logochicken.png" alt="Smart Village Logo" class="header-logo" onerror="this.style.display='none'">
        </div>
        <h1 class="head-content">ระบบจัดการข้อมูลลูกบ้าน</h1>
        <button type="button" id="logoutBtn" class="logout-btn">ออกจากระบบ</button>
    </header>

    <main class="main-content">
        <div class="content-area">
            <!-- หน้า USER DATA -->
            <section class="page active" id="page-user">
                <section class="homeDetail" id="userDirectDetail">
                </section>
            </section>

            <!-- หน้า ประวัติการเข้า-ออกของรถ -->
            <section class="page" id="page-vehicleDetail"></section>
        </div>
    </main>

    <!-- Modal ป๊อปอัพเพิ่มรถยนต์ใหม่ -->
    <div id="addVehicleModal" class="login-modal-overlay" style="display: none;">
        <div class="login-box" style="max-width: 380px;">
            <h3 style="color: var(--color-primary); margin-bottom: 10px;">ลงทะเบียนเพิ่มยานพาหนะ</h3>
            <p style="font-size: 13px; color: #666; margin-bottom: 15px;">กรอกข้อมูลรถยนต์เพื่อลงทะเบียนเข้าฐานข้อมูล
            </p>

            <form id="addVehicleForm" style="display: flex; flex-direction: column; gap: 12px;">
                <input type="text" id="inputPlate" placeholder="ป้ายทะเบียน (เช่น กข1277)" required autocomplete="off"
                    style="padding: 12px; border-radius: 8px; border: 1px solid var(--color-border); font-family: Prompt; font-size: 14px;">
                <input type="text" id="inputProvince" placeholder="จังหวัด (เช่น ลำพูน หรือ เชียงใหม่)" required
                    autocomplete="off"
                    style="padding: 12px; border-radius: 8px; border: 1px solid var(--color-border); font-family: Prompt; font-size: 14px;">

                <div style="text-align: left; font-size: 13px; color: #555; font-weight: 500;">ประเภท ยานพาหนะ:</div>
                <input type="text" value="รถยนต์" readonly
                    style="padding: 10px; border-radius: 8px; border: 1px solid var(--color-border); font-family: Prompt; font-size: 14px; background-color: #e9ecef; color: #495057; cursor: not-allowed;">

                <div style="display: flex; gap: 10px; margin-top: 10px;">
                    <button type="button" class="submit-btn" id="btnCancelAddVehicle"
                        style="background-color: #6c757d; flex: 1;">ยกเลิก</button>
                    <button type="submit" class="submit-btn" style="flex: 1;">บันทึกข้อมูล</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal QR Code -->
    <div id="qrModal" class="login-modal-overlay" style="display: none;">
        <div class="login-box qr-modal-box">
            <h3 class="qr-title">QR Code สำหรับแขก/ผู้ติดต่อ</h3>
            <p class="qr-subtitle">แสดงต่อกล้อง/เครื่องสแกนเพื่อเข้าหมู่บ้าน</p>

            <div class="visitor-code-badge">
                รหัสผ่านเข้าหมู่บ้าน: <span id="visitorCodeDisplay">-</span>
            </div>

            <div id="qrImageContainer" class="qr-img-wrap"></div>

            <div id="qrDataText" class="qr-data-text"></div>

            <button type="button" class="submit-btn" id="btnCloseQr">ปิดหน้าต่าง</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
